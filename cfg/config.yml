# ============================================================================
# daita-studio Configuration
# ============================================================================
# DB-Credentials und -Settings → siehe database.yml
# ============================================================================

# Installation Root (alle relativen Pfade beziehen sich hierauf)
# Leer lassen → wird automatisch aus Datei-Lage ermittelt
# install_root: '/mnt/user/devel/daita-lakehouse/daita-studio'

# ==========================================================================
# Server-Ports
# ==========================================================================
server:
  backend_port: 9021
  frontend_port: 8021

# ==========================================================================
# Pfade für generierte Artefakte
# ==========================================================================
paths:
  # DDL-Dateien (CREATE/DROP TABLE)
  ddl_output: 'ddl/generated'

  # TPT Scripts
  tpt_output: 'tpt/generated'
  tpt_log: 'log/tpt'

  # SQL Templates (Input)
  sql_templates: 'etl/sql_templates'

  # SQL generiert
  sql_output: 'sql/generated'

  # Layer-Bulk-Export (Job-Scripts, DDLs, Views) -- F10
  export_layers: 'sql/export_layers'

  # Logs
  log: 'log'

  # ETL Jobs (Parameter-JSONs, DDL-Artefakte)
  etl_jobs: 'etl/jobs'

  # Diagramm-Layouts (ERD)
  diagrams: 'diagrams'

  # Dashboard-Definitionen (katalog.yml, <id>.yml, sql/, geo/) – relativ zu
  # install_root. Kundenspezifische Dashboards liegen im Kunden-Workspace,
  # z. B. '../<kunde>-lakehouse/dashboards'. Default: neutrales Beispiel.
  dashboards: 'cfg/dashboards_beispiel'

# ==========================================================================
# Logging
# ==========================================================================
logging:
  level: 'INFO'

# ==========================================================================
# Auth / RBAC
# ==========================================================================
# token_secret:  Geheimer Schlüssel zum Signieren der Login-Tokens.
#                UNBEDINGT auf dem Zielsystem auf einen langen Zufallswert
#                ändern (z.B. `python -c "import secrets; print(secrets.token_hex(32))"`).
#                Leer lassen -> beim Start wird ein flüchtiges Secret erzeugt
#                (Nutzer müssen sich nach jedem Neustart neu anmelden).
# token_ttl_hours: Gültigkeitsdauer eines Tokens in Stunden.
auth:
  token_secret: '6ad0a8b3f99c72a0ffe885df1df845c9c32cad00e85543e82b443368c9dc87e1'
  token_ttl_hours: 8

  # ------------------------------------------------------------------------
  # Rechte-Matrix je Modul (Modul x Aktion -> benoetigte Mindestrolle)
  # ------------------------------------------------------------------------
  # Rollen (aufsteigend):  Viewer < Editor < Admin
  # Aktionen:
  #   view   = ansehen  (HTTP GET/HEAD)
  #   edit   = anlegen/aendern (HTTP POST/PUT/PATCH)
  #   delete = loeschen (HTTP DELETE)
  #
  # Beispiel "nur ansehen": Setzt man fuer ein Modul  edit: Admin, duerfen
  # Editoren dieses Modul nur noch ANSEHEN, aber nicht mehr bearbeiten.
  #
  # Nicht aufgefuehrte Module/Aktionen erben von 'default' (siehe unten).
  # ------------------------------------------------------------------------
  modules:
    # Datenmodelle (Modeler, Diagramme, Import/Reverse-Engineering)
    modeler:
      view:   Viewer
      edit:   Editor
      delete: Admin

    # Jobs / ETL (ETL-Orchestrator, Job-Management, Templates)
    etl:
      view:   Viewer
      edit:   Editor
      delete: Admin

    # Lineage / Dataflow
    lineage:
      view:   Viewer
      edit:   Editor
      delete: Admin

    # Metadaten
    metadata:
      view:   Viewer
      edit:   Editor
      delete: Admin

    # Quellsysteme (Sources / TPT)
    sources:
      view:   Viewer
      edit:   Editor
      delete: Admin

    # Dashboards (ansehen; edit = Cache leeren)
    dashboards:
      view:   Viewer
      edit:   Editor
      delete: Admin

  # Fallback fuer alles, was oben nicht explizit gesetzt ist
  default:
    view:   Viewer
    edit:   Editor
    delete: Admin
