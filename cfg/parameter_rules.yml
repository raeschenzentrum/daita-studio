# ============================================================================
# Parameter-Generierungsregeln für Job-Steps
# ============================================================================
# Diese Config definiert wie Step-Parameter aus User-Input generiert werden.
# Template-Parameter-Werte werden IGNORIERT - nur die Struktur zählt.
# ============================================================================

# ==========================================================================
# Layer-Konfiguration
# ==========================================================================
# Jeder Layer hat eigene Regeln für Datenbanken, Präfixe, Suffixe
layers:
  raw:
    database: "MDP01_RAW_LAYER"
    # RAW = 1:1 Kopie, keine Historisierung
    
  discoverable:
    database: "MDP01_DISCOVERABLE_LAYER"
    history_suffix: "_HISTORY"        # Suffix für historisierte Tabellen
    key_prefix: "KEY_"                # Prefix für Key-Tabellen (Surrogate Keys)
    
  reusable:
    database: "MDP01_REUSABLE_LAYER"
    history_suffix: "_HISTORY"
    
  consumable:
    database: "MDP01_CONSUMABLE_LAYER"
    # Finale Tabellen, typischerweise ohne _HISTORY Suffix

# ==========================================================================
# Staging-Tabellen (temporär, Layer-übergreifend)
# ==========================================================================
staging:
  prefix: "temp_"
  suffix: "_staging"

# ==========================================================================
# Composite Key Konfiguration
# ==========================================================================
# Wenn ein Natural Key aus mehreren Spalten besteht, werden sie zu einem
# einzigen NATURAL_KEY_VALUE-String konkateniert.
# Der Separator muss so gewählt sein, dass er NICHT in den PK-Werten vorkommt.
composite_key:
  separator: "~|~"      # Trennzeichen zwischen PK-Teilen (kollisionssicher)
  max_col_length: 100   # Max. Länge pro PK-Spalte im zusammengesetzten Key-String

# ==========================================================================
# Core-Name Extraktion
# ==========================================================================
# Wie wird der "Core Name" aus dem Source-Tabellennamen extrahiert?
# z.B. "zas_einkommen" → "einkommen", "TAAA_IDENTITAET" → "IDENTITAET"
core_name_extraction:
  # Prefixe die entfernt werden (Reihenfolge wichtig - längste zuerst)
  remove_prefixes:
    - "TAAA_"
    - "TAAS_"
    - "TAA_"
    - "zas_"
    - "ZAS_"

# ==========================================================================
# Parameter-Generierung pro Parameter-Typ
# ==========================================================================
# Definiert wie jeder Parameter aus User-Input generiert wird.
# Variablen: {source_table}, {target_table}, {core_name}, {pk_columns}, {hash_columns}
parameter_generation:
  # Key-Database: aus databases.key_database Config
  KEY_DATABASE:
    source: "config:databases.key_database"
    description: "Database für Key-Tabellen (Surrogate Keys)"
  
  # Key-Tabelle: prefix + core_name (uppercase)
  KEY_TABLE:
    pattern: "{key_table_prefix}{core_name_upper}"
    description: "Name der Key-Tabelle für Natural Keys"
  
  # Natural Key Column: erste PK-Spalte
  NATURAL_KEY_COL:
    source: "first_pk_column"
    description: "Primäre Natural Key Spalte"
  
  # Business Key: alle PK-Spalten kommasepariert
  BUSINESS_KEY:
    source: "pk_columns_csv"
    description: "Alle Business Key Spalten"
  
  # Staging-Tabelle: prefix + source + suffix
  STAGING_TABLE:
    pattern: "{staging_prefix}{source_table}{staging_suffix}"
    description: "Temporäre Staging-Tabelle"
  
  # Temp-Tabelle für neue Records (SCD2)
  NEW_RECORDS_TABLE:
    pattern: "{staging_prefix}{source_table}_new"
    description: "Temporäre Tabelle für neue Records"
  
  # Temp-Tabelle für geänderte Records (SCD2)
  CHANGED_RECORDS_TABLE:
    pattern: "{staging_prefix}{source_table}_changed"
    description: "Temporäre Tabelle für geänderte Records"
  
  # Source/Target werden direkt übernommen
  SOURCE_TABLE:
    source: "source_table"
    description: "Quell-Tabelle"
  
  TARGET_TABLE:
    source: "target_table"
    description: "Ziel-Tabelle"
  
  # Hash-Spalten für SCD2
  HASH_COLUMNS:
    source: "hash_columns_csv"
    description: "Spalten für Change-Detection Hash"
  
  # Select-Spalten (alle zu ladenden)
  SELECT_COLUMNS:
    source: "select_columns_csv"
    description: "Alle zu selektierenden Spalten"
  
  # Insert-Spalten für Target-Tabelle
  INSERT_COLUMNS:
    source: "select_columns"
    description: "Spalten für INSERT in Target-Tabelle (= select_columns)"
  
  # Source-Database (aus Layer-Config)
  SOURCE_DATABASE:
    source: "config:layers.raw.database"
    description: "Quell-Database (typisch RAW Layer)"

# ==========================================================================
# SCD2 Technische Spalten
# ==========================================================================
# Namen, Datentypen und Defaults der technischen Spalten bei SCD2-Historisierung.
# pattern: Platzhalter {core_name} wird durch Tabellen-Kernname ersetzt
# fallback: Wird verwendet wenn core_name leer ist
# type: Teradata-Datentyp
# nullable: true/false (default: true)
# default: SQL DEFAULT-Klausel (ohne DEFAULT Keyword)
scd2_technical_columns:
  # Surrogate Key (erste Spalte, tabellenspezifischer Name)
  surrogate_key:
    pattern: "{core_name}_SK"
    fallback: "SURROGATE_KEY"
    type: "BIGINT"
    nullable: false
  
  # SCD2 Versionierung
  valid_from:
    name: "VALID_FROM"
    type: "TIMESTAMP(6)"
    nullable: false
    default: "CURRENT_TIMESTAMP(6)"
    # Gültigkeitsbeginn des initialen Stands (ADR-0016): erste Version eines Keys aus dem
    # ersten Ladelauf des Jobs. Vor dem ersten Snapshot ist nur der letzte Quellstand bekannt.
    # Leer = Snapshot-Zeit. Wirkt im Template-Set RAW_TO_DISC_SCD2_DELTA.
    initial_value: "1000-01-01 00:00:00"
  
  valid_to:
    name: "VALID_TO"
    type: "TIMESTAMP(6)"
    nullable: true
  
  is_current:
    name: "IS_CURRENT"
    type: "CHAR(1) CHARACTER SET UNICODE"
    nullable: true
    default: "'Y'"
    current_value: "Y"      # Wert für aktuelle Version (ohne Quotes, für WHERE/SET/INSERT)
    closed_value: "N"       # Wert für geschlossene/historische Version
  
  # Change Detection Hash
  record_hash:
    name: "RECORD_HASH"
    type: "BYTE(20)"
    nullable: true
  
  # Audit Spalten
  created_timestamp:
    name: "CREATED_TIMESTAMP"
    type: "TIMESTAMP(6)"
    nullable: false
    default: "CURRENT_TIMESTAMP(6)"
  
  last_updated_timestamp:
    name: "LAST_UPDATED_TIMESTAMP"
    type: "TIMESTAMP(6)"
    nullable: true
  
  created_by:
    name: "CREATED_BY"
    type: "VARCHAR(128) CHARACTER SET UNICODE"
    nullable: true
    default: "USER"
  
  last_updated_by:
    name: "LAST_UPDATED_BY"
    type: "VARCHAR(128) CHARACTER SET UNICODE"
    nullable: true

# ==========================================================================
# DDL-Optionen für Target-Tabellen
# ==========================================================================
target_table_ddl:
  # Teradata SET vs MULTISET
  table_type: "SET"
  
  # Primary Index Definition (Platzhalter werden ersetzt)
  # {sk_column}: Surrogate Key Spaltenname (z.B. AUFENTHALT_SK)
  # {valid_from}: VALID_FROM Spaltenname
  primary_index:
    columns:
      - "{sk_column}"
      - "{valid_from}"

# ==========================================================================
# RAW-Deltas (Template-Set RAW_TO_DISC_SCD2_DELTA)
# ==========================================================================
# Technikspalten der RAW-Tabellen: Ladelauf, Snapshot-Zeit, Änderungsart.
# Sie werden nie geladen oder gehasht (gilt für alle Template-Sets).
# Das Delta-Set historisiert die Versionen in Ladereihenfolge:
#   VALID_FROM = Snapshot-Zeit, VALID_TO = Snapshot-Zeit der Folgezeile
#   (halboffen), offen = open_valid_to.
raw_delta:
  load_id_column: "LADE_ID"
  snapshot_column: "SNAPSHOT_DT"
  change_type_column: "CHANGETYPE"
  change_type_values:
    insert: "INSERTED"
    update: "UPDATED"
    delete: "DELETED"
  open_valid_to: "9999-12-31 23:59:59.999999"
  # Obergrenze für den Ladelauf (Step-Parameter MAX_LOAD_ID). Je Lauf wählbar über
  # „Laden bis Lade-ID“ (max_load_id beim Start); der Ladestand rückt dann bis zur
  # Obergrenze vor, auch ohne Lieferung der Tabelle (confirm_load_state.sql)
  max_load_id: 9223372036854775807
  # Ladestand je Job in der Meta-DB (wird im letzten Step fortgeschrieben)
  load_state_table: "META_ETL_LOAD_STATE"
  # Zusatzspalten der Zieltabelle (Namen nach ADR-0015: Präfix DWH_)
  target_columns:
    load_id:
      name: "DWH_LOAD_ID"
      type: "BIGINT"
    # Ladelauf, der die Version geschlossen bzw. als gelöscht markiert hat
    # (NULL, solange offen); Highwatermark der Folgeschicht: DWH_LOAD_ID oder
    # DWH_UPDATE_LOAD_ID > Ladestand
    update_load_id:
      name: "DWH_UPDATE_LOAD_ID"
      type: "BIGINT"
    deleted_in_source:
      name: "DWH_DELETED_IN_SOURCE"
      type: "CHAR(1) CHARACTER SET UNICODE"
      default: "'N'"
      deleted_value: "Y"
      not_deleted_value: "N"

# ============================================================================
# Reusable mit eigener Historie (Template-Set DISC_TO_REUS_KEYED_HISTORY)
# ============================================================================
# Quelle ist eine View im Discoverable: Sie kapselt die Business-Logik
# (Zuschnitt, Namen, Integration mehrerer Tabellen) und liefert je Zeile eine
# Version mit den Versionsspalten unten. Das Template-Set macht nur die
# technische Historisierung: Highwatermark auf Ladelauf/Änderungs-Ladelauf,
# Vorgänger fortsetzen oder schließen, neue Versionen anhängen; Zeitpunkte aus
# der Quelle, nie die Ladezeit. Ein Job kann mehrere Rollen haben (z.B. Haupt-
# und Texttabelle) mit gemeinsamer KEY-Tabelle.
keyed_history:
  source_columns:            # Versionsspalten der Quell-View
    valid_from: "VALID_FROM"
    valid_to: "VALID_TO"           # offen = open_valid_to; daraus folgt "aktuell"
    deleted_in_source: "DWH_DELETED_IN_SOURCE"
    load_id: "DWH_LOAD_ID"
    update_load_id: "DWH_UPDATE_LOAD_ID"
  target_columns:            # technische Spalten der Zieltabellen (ADR-0015)
    valid_from:        {name: "DWH_VALID_FROM",        type: "TIMESTAMP(6) NOT NULL"}
    valid_to:          {name: "DWH_VALID_TO",          type: "TIMESTAMP(6) NOT NULL"}
    is_current:        {name: "DWH_IS_CURRENT",        type: "CHAR(1) CHARACTER SET UNICODE NOT NULL"}
    deleted_in_source: {name: "DWH_DELETED_IN_SOURCE", type: "CHAR(1) CHARACTER SET UNICODE NOT NULL"}
    load_id:           {name: "DWH_LOAD_ID",           type: "BIGINT"}
    update_load_id:    {name: "DWH_UPDATE_LOAD_ID",    type: "BIGINT"}
    record_hash:       {name: "DWH_RECORD_HASH",       type: "BYTE(20)"}
    created_ts:        {name: "DWH_CREATED_TS",        type: "TIMESTAMP(6) NOT NULL"}
    updated_ts:        {name: "DWH_UPDATED_TS",        type: "TIMESTAMP(6)"}
  values:
    is_current: "Y"
    is_closed: "N"
    deleted: "Y"
    not_deleted: "N"
  # Gültigkeit der festen Zeile -1 (ADR-0016: Beginn des initialen Stands)
  initial_valid_from: "1000-01-01 00:00:00"
  open_valid_to: "9999-12-31 23:59:59.999999"
  # Länge, auf die Textspalten im Hash gecastet werden
  hash_cast_length: 1000
  # Volatile Tabellen je Rolle: <prefix><zieltabelle><suffix>
  staging_prefix: "temp_"
